# Safe local/demo configuration. Replace log_file_path before production use.
log_file_path: demo_access.log
log_format_preset: nginx_combined
log_format_regex: ""
effective_ip_header: X-Forwarded-For

firewall_backend: mock
whitelist:
  - 127.0.0.1
  - "::1"

anomaly_threshold: 0.3
max_escalation_rate: 10
min_training_samples: 200
base_model_path: data/base_model.joblib
isolation_forest_model_path: data/if_model.joblib

llm_enabled: false
llm_base_url: http://127.0.0.1:1234/v1
llm_model_path: models/model.gguf
llm_timeout_s: 30
llm_max_tokens: 256
llm_n_ctx: 2048
llm_n_threads: 4
max_traffic_history_context: 20

default_ban_duration_s: 3600
db_path: morphiq.db
traffic_retention_s: 86400
pid_file_path: morphiq.pid
morphiq_log_file: logs/morphiq.log
log_level: INFO

queue_maxsize: 1000
config_reload_debounce_s: 5
poll_interval_s: 60
probe_window_s: 300
probe_threshold: 15

dashboard_enabled: true
dashboard_host: 127.0.0.1
dashboard_port: 7373

heuristic_patterns:
  - name: SQL injection
    field: path
    pattern: '(union\s+select|select\s+.*\s+from|drop\s+table|;\s*--)'
    description: Common SQL injection tokens in the request path.
  - name: Cross-site scripting
    field: path
    pattern: '(<script|javascript:|onerror\s*=|onload\s*=)'
    description: Common browser script-injection tokens.
  - name: Path traversal
    field: path
    pattern: '(\.\./|%2e%2e%2f|%2e%2e/|%2e%2e%5c)'
    description: Parent-directory traversal attempts.
