<!DOCTYPE html>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);color:var(--color-text-primary);background:transparent;padding:0}
.app{max-width:680px;margin:0 auto;padding:1.5rem 0}
.logo{font-size:22px;font-weight:500;letter-spacing:-0.5px;margin-bottom:4px}
.logo span{color:#7F77DD}
.subtitle{font-size:13px;color:var(--color-text-secondary);margin-bottom:1.5rem}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:12px}
.card-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
label{font-size:13px;color:var(--color-text-secondary);display:block;margin-bottom:4px}
input,select,textarea{width:100%;font-size:14px;padding:8px 10px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);outline:none;font-family:var(--font-sans)}
input:focus,select:focus,textarea:focus{border-color:var(--color-border-primary);box-shadow:0 0 0 2px rgba(127,119,221,0.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.format-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.fmt-btn{border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px 10px;cursor:pointer;background:var(--color-background-secondary);font-size:13px;color:var(--color-text-secondary);text-align:center;transition:all .15s}
.fmt-btn:hover{border-color:var(--color-border-primary);color:var(--color-text-primary)}
.fmt-btn.active{border-color:#7F77DD;background:#EEEDFE;color:#3C3489;font-weight:500}
.constraint-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.constraint-row input,.constraint-row select{flex:1}
.constraint-row .rm{cursor:pointer;font-size:16px;color:var(--color-text-tertiary);padding:0 4px;line-height:1;flex-shrink:0}
.constraint-row .rm:hover{color:var(--color-text-danger)}
.add-btn{font-size:13px;color:#7F77DD;cursor:pointer;background:none;border:none;padding:2px 0;font-family:var(--font-sans)}
.add-btn:hover{text-decoration:underline}
.gen-btn{width:100%;padding:11px;border-radius:var(--border-radius-md);border:none;background:#534AB7;color:#fff;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--font-sans);transition:background .15s;margin-top:4px}
.gen-btn:hover{background:#3C3489}
.gen-btn:disabled{background:var(--color-border-secondary);color:var(--color-text-tertiary);cursor:not-allowed}
.status{font-size:13px;color:var(--color-text-secondary);text-align:center;padding:8px 0}
.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.results-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.04em}
.dl-btns{display:flex;gap:8px}
.dl-btn{font-size:12px;padding:5px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-primary);font-family:var(--font-sans)}
.dl-btn:hover{background:var(--color-background-tertiary)}
.data-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.data-table th{text-align:left;padding:7px 8px;border-bottom:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.data-table td{padding:7px 8px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:top;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:0}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--color-background-secondary)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-pos{background:#EAF3DE;color:#27500A}
.badge-neg{background:#FCEBEB;color:#791F1F}
.badge-neu{background:#F1EFE8;color:#444441}
.err{color:var(--color-text-danger);font-size:13px;padding:8px 0;text-align:center}
.key-row{display:flex;gap:8px}
.key-row input{flex:1}
.key-toggle{font-size:12px;color:var(--color-text-secondary);cursor:pointer;padding:8px 10px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);white-space:nowrap;font-family:var(--font-sans)}
.progress{height:3px;background:var(--color-border-tertiary);border-radius:2px;overflow:hidden;margin:8px 0}
.progress-bar{height:100%;background:#7F77DD;width:0%;transition:width .3s}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.stat-label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:3px}
.stat-val{font-size:18px;font-weight:500;color:var(--color-text-primary)}
</style>

<div class="app">
  <div class="logo">Morph<span>iq</span></div>
  <div class="subtitle">Synthetic dataset generator — powered by Claude</div>

  <div class="card">
    <div class="card-title">API key</div>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
      <button class="key-toggle" onclick="toggleKey()">Show</button>
    </div>
    <div style="font-size:11px;color:var(--color-text-tertiary);margin-top:6px">Never leaves your browser. Get yours at console.anthropic.com</div>
  </div>

  <div class="card">
    <div class="card-title">Dataset config</div>
    <div style="margin-bottom:10px">
      <label>Topic / domain</label>
      <input type="text" id="topic" placeholder="e.g. customer support for a SaaS product, medical triage, legal contracts...">
    </div>
    <div class="row2" style="margin-bottom:10px">
      <div>
        <label>Format</label>
        <div class="format-grid" style="grid-template-columns:1fr 1fr 1fr">
          <div class="fmt-btn active" data-fmt="instruction">Instruction tuning</div>
          <div class="fmt-btn" data-fmt="classification">Classification</div>
          <div class="fmt-btn" data-fmt="preference">Preference pairs</div>
        </div>
      </div>
      <div>
        <label>Rows to generate</label>
        <select id="numRows">
          <option value="10">10 rows (fast)</option>
          <option value="25" selected>25 rows</option>
          <option value="50">50 rows</option>
          <option value="100">100 rows</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:6px">
      <label>Tone / style</label>
      <select id="tone">
        <option value="neutral">Neutral</option>
        <option value="formal">Formal / professional</option>
        <option value="casual">Casual / conversational</option>
        <option value="technical">Technical / domain-specific</option>
        <option value="simple">Simple / plain language</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Constraints</div>
    <div id="constraintList"></div>
    <button class="add-btn" onclick="addConstraint()">+ Add constraint</button>
  </div>

  <div class="card" id="advCard">
    <div class="card-title">Advanced</div>
    <div class="row2">
      <div>
        <label>Language</label>
        <select id="lang">
          <option value="English">English</option>
          <option value="Hindi">Hindi</option>
          <option value="Spanish">Spanish</option>
          <option value="French">French</option>
          <option value="German">German</option>
          <option value="Arabic">Arabic</option>
          <option value="Chinese">Chinese</option>
        </select>
      </div>
      <div>
        <label>Diversity level</label>
        <select id="diversity">
          <option value="low">Low — focused examples</option>
          <option value="medium" selected>Medium — varied</option>
          <option value="high">High — wide range</option>
        </select>
      </div>
    </div>
  </div>

  <button class="gen-btn" id="genBtn" onclick="generate()">Generate dataset</button>
  <div class="progress" id="progressWrap" style="display:none"><div class="progress-bar" id="progressBar"></div></div>
  <div class="status" id="status"></div>
  <div class="err" id="errMsg"></div>

  <div id="resultsArea" style="display:none">
    <div class="stat-row">
      <div class="stat"><div class="stat-label">Rows generated</div><div class="stat-val" id="statRows">0</div></div>
      <div class="stat"><div class="stat-label">Avg prompt length</div><div class="stat-val" id="statLen">—</div></div>
      <div class="stat"><div class="stat-label">Constraint pass rate</div><div class="stat-val" id="statPass">—</div></div>
    </div>
    <div class="card">
      <div class="results-header">
        <div class="results-title">Preview</div>
        <div class="dl-btns">
          <button class="dl-btn" onclick="download('jsonl')">JSONL</button>
          <button class="dl-btn" onclick="download('csv')">CSV</button>
          <button class="dl-btn" onclick="download('json')">JSON</button>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table class="data-table" id="dataTable"></table>
      </div>
    </div>
  </div>
</div>

<script>
let selectedFmt = 'instruction';
let generatedData = [];
let constraints = [];

document.querySelectorAll('.fmt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedFmt = btn.dataset.fmt;
  });
});

function toggleKey() {
  const inp = document.getElementById('apiKey');
  const btn = event.target;
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = 'Hide'; }
  else { inp.type = 'password'; btn.textContent = 'Show'; }
}

const CONSTRAINT_TYPES = [
  {val:'max_length', label:'Max length (chars)'},
  {val:'min_length', label:'Min length (chars)'},
  {val:'no_overlap', label:'No duplicate phrases'},
  {val:'label_dist', label:'Label distribution (%)'},
  {val:'must_include', label:'Must include keyword'},
  {val:'must_exclude', label:'Must exclude keyword'},
  {val:'reading_level', label:'Reading level'},
  {val:'no_pii', label:'No PII'},
  {val:'balanced_classes', label:'Balanced classes'},
];

function addConstraint() {
  const id = Date.now();
  constraints.push({id, type: 'max_length', value: ''});
  renderConstraints();
}

function removeConstraint(id) {
  constraints = constraints.filter(c => c.id !== id);
  renderConstraints();
}

function renderConstraints() {
  const el = document.getElementById('constraintList');
  if (constraints.length === 0) {
    el.innerHTML = '<div style="font-size:13px;color:var(--color-text-tertiary);padding:4px 0 10px">No constraints added — Claude will use sensible defaults.</div>';
    return;
  }
  el.innerHTML = constraints.map(c => `
    <div class="constraint-row">
      <select onchange="updateConstraint(${c.id},'type',this.value)">
        ${CONSTRAINT_TYPES.map(t => `<option value="${t.val}" ${c.type===t.val?'selected':''}>${t.label}</option>`).join('')}
      </select>
      <input type="text" placeholder="value" value="${c.value}" onchange="updateConstraint(${c.id},'value',this.value)" style="max-width:130px">
      <span class="rm" onclick="removeConstraint(${c.id})">×</span>
    </div>
  `).join('');
}

function updateConstraint(id, key, val) {
  const c = constraints.find(x => x.id === id);
  if (c) c[key] = val;
}

renderConstraints();

function buildSystemPrompt() {
  const topic = document.getElementById('topic').value.trim();
  const tone = document.getElementById('tone').value;
  const lang = document.getElementById('lang').value;
  const diversity = document.getElementById('diversity').value;
  const n = parseInt(document.getElementById('numRows').value);

  const fmtInstructions = {
    instruction: `Generate instruction-tuning pairs. Each row must have:
- "instruction": a clear task or prompt a user might give an AI assistant
- "response": a high-quality, accurate completion of that instruction
The instruction should be a natural user request. The response should be helpful and complete.`,

    classification: `Generate text classification examples. Each row must have:
- "text": a piece of text to be classified
- "label": the correct category label for that text
- "label_explanation": one sentence explaining why this label applies
Use 3-5 consistent label categories across all rows. Balance classes unless overridden by constraints.`,

    preference: `Generate preference pairs for RLHF/DPO training. Each row must have:
- "prompt": a user request or question
- "chosen": a high-quality, preferred response
- "rejected": a plausible but inferior response (subtle flaws: vague, wrong tone, incomplete, slightly off)
- "reason": one sentence explaining what makes chosen better than rejected`
  };

  const constraintText = constraints.length > 0
    ? '\n\nStrict constraints to enforce on every row:\n' + constraints.map(c => {
        if (c.type === 'max_length') return `- Maximum ${c.value} characters in the main text field`;
        if (c.type === 'min_length') return `- Minimum ${c.value} characters in the main text field`;
        if (c.type === 'must_include') return `- Must include the word or phrase: "${c.value}"`;
        if (c.type === 'must_exclude') return `- Must NOT include: "${c.value}"`;
        if (c.type === 'no_overlap') return `- No two rows should share more than 3 consecutive words`;
        if (c.type === 'label_dist') return `- Label distribution: ${c.value}`;
        if (c.type === 'reading_level') return `- Reading level: ${c.value}`;
        if (c.type === 'no_pii') return `- No personally identifiable information (names, emails, phones, addresses)`;
        if (c.type === 'balanced_classes') return `- Balance classes evenly across all rows`;
        return `- ${c.type}: ${c.value}`;
      }).join('\n')
    : '';

  return `You are Morphiq, a synthetic dataset generator. Generate exactly ${n} high-quality, diverse synthetic training examples for the following domain: "${topic}".

${fmtInstructions[selectedFmt]}

Tone: ${tone}
Language: ${lang}
Diversity level: ${diversity} — ${diversity === 'high' ? 'make examples widely varied in topic, style, and complexity' : diversity === 'low' ? 'keep examples focused and consistent' : 'use moderate variety across examples'}${constraintText}

CRITICAL: Respond with ONLY a valid JSON array. No markdown, no explanation, no preamble. Just the raw JSON array starting with [ and ending with ].
Every object must have exactly the required fields. No extra fields.`;
}

function setProgress(pct) {
  document.getElementById('progressBar').style.width = pct + '%';
}

async function generate() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const topic = document.getElementById('topic').value.trim();
  const errEl = document.getElementById('errMsg');
  const statusEl = document.getElementById('status');

  errEl.textContent = '';
  if (!apiKey) { errEl.textContent = 'Please enter your Anthropic API key.'; return; }
  if (!topic) { errEl.textContent = 'Please enter a topic or domain.'; return; }

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.textContent = 'Generating...';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  setProgress(10);
  statusEl.textContent = 'Sending request to Claude...';

  try {
    setProgress(25);
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 8000,
        messages: [{ role: 'user', content: buildSystemPrompt() }]
      })
    });

    setProgress(70);
    statusEl.textContent = 'Parsing response...';

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err?.error?.message || `API error ${resp.status}`);
    }

    const data = await resp.json();
    const raw = data.content?.[0]?.text || '';

    const jsonMatch = raw.match(/\[[\s\S]*\]/);
    if (!jsonMatch) throw new Error('Claude returned unexpected format. Try again.');

    generatedData = JSON.parse(jsonMatch[0]);
    if (!Array.isArray(generatedData) || generatedData.length === 0) throw new Error('No data returned. Try a different topic.');

    setProgress(100);
    statusEl.textContent = '';
    renderResults(generatedData);

  } catch (e) {
    errEl.textContent = e.message || 'Something went wrong. Check your API key and try again.';
    statusEl.textContent = '';
    setProgress(0);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate dataset';
    setTimeout(() => { document.getElementById('progressWrap').style.display = 'none'; setProgress(0); }, 600);
  }
}

function renderResults(data) {
  if (!data.length) return;
  document.getElementById('resultsArea').style.display = 'block';

  document.getElementById('statRows').textContent = data.length;

  const firstKey = Object.keys(data[0])[0];
  const avgLen = Math.round(data.reduce((s, r) => s + (r[firstKey]||'').toString().length, 0) / data.length);
  document.getElementById('statLen').textContent = avgLen;

  let passCount = data.length;
  constraints.forEach(c => {
    if (c.type === 'max_length' && c.value) {
      passCount = data.filter(r => (r[firstKey]||'').toString().length <= parseInt(c.value)).length;
    }
  });
  document.getElementById('statPass').textContent = Math.round((passCount / data.length) * 100) + '%';

  const keys = Object.keys(data[0]);
  const table = document.getElementById('dataTable');
  table.innerHTML = `
    <thead><tr>${keys.map(k => `<th>${k}</th>`).join('')}</tr></thead>
    <tbody>${data.slice(0, 20).map(row => `<tr>${keys.map(k => {
      const v = (row[k] || '').toString();
      if (k === 'label') {
        const cls = v.toLowerCase().includes('pos') || v.toLowerCase().includes('good') || v.toLowerCase().includes('chosen') ? 'badge-pos' : v.toLowerCase().includes('neg') || v.toLowerCase().includes('bad') || v.toLowerCase().includes('reject') ? 'badge-neg' : 'badge-neu';
        return `<td><span class="badge ${cls}">${v}</span></td>`;
      }
      return `<td title="${v.replace(/"/g,'&quot;')}">${v.slice(0, 80)}${v.length > 80 ? '…' : ''}</td>`;
    }).join('')}</tr>`).join('')}</tbody>
  `;

  document.getElementById('resultsArea').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function download(fmt) {
  if (!generatedData.length) return;
  let content, mime, ext;
  if (fmt === 'json') {
    content = JSON.stringify(generatedData, null, 2);
    mime = 'application/json'; ext = 'json';
  } else if (fmt === 'jsonl') {
    content = generatedData.map(r => JSON.stringify(r)).join('\n');
    mime = 'application/jsonl'; ext = 'jsonl';
  } else {
    const keys = Object.keys(generatedData[0]);
    const esc = v => `"${String(v).replace(/"/g,'""')}"`;
    content = [keys.map(esc).join(','), ...generatedData.map(r => keys.map(k => esc(r[k]||'')).join(','))].join('\n');
    mime = 'text/csv'; ext = 'csv';
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type: mime}));
  a.download = `morphiq_${document.getElementById('topic').value.trim().replace(/\s+/g,'_').slice(0,30)||'dataset'}.${ext}`;
  a.click();
}
</script>
